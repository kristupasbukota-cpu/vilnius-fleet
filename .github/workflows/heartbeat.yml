# The alarm deliberately does not live on the collector box.
#
# On 18 August that machine stopped executing userspace for 48 minutes. Anything
# installed there to report the problem would have been frozen too. So the box only
# ever says "I am fine", every 15 minutes, by force-updating a single commit on the
# `status` branch. This job watches for that to stop, from infrastructure the box has
# no influence over, and opens an issue. GitHub emails issue notifications to the
# repository owner, so no address, token or password is configured anywhere.
name: heartbeat

on:
  schedule:
    # Not on the hour. GitHub's scheduler is busiest then and delays are common.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: heartbeat

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const STALE_MIN = 90;      // three missed heartbeats, plus slack
            const QUIET_H = 6;         // do not comment on an open issue more often
            const LABEL = 'heartbeat';
            const { owner, repo } = context.repo;
            const problems = [];
            let hb = null, ageMin = null;

            let branch = null;
            try {
              branch = (await github.rest.repos.getBranch(
                { owner, repo, branch: 'status' })).data;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            if (!branch) {
              problems.push('There is no `status` branch. The box has never sent a heartbeat.');
            } else {
              const when = new Date(branch.commit.commit.committer.date);
              ageMin = Math.round((Date.now() - when.getTime()) / 60000);
              if (ageMin > STALE_MIN) {
                problems.push(
                  `**No heartbeat for ${ageMin} minutes.** The last one was ` +
                  `${when.toISOString()}. The box sends one every 15 minutes, so ` +
                  `anything past ${STALE_MIN} means it is not reporting: frozen, ` +
                  `rebooting, off the network, or the push is failing.`);
              }
              try {
                const f = await github.rest.repos.getContent(
                  { owner, repo, path: 'heartbeat.json', ref: 'status' });
                hb = JSON.parse(Buffer.from(f.data.content, 'base64').toString());
                if (hb.state !== 'ok') {
                  problems.push(
                    `**The box reports \`${hb.state}\`.**\n\n` +
                    hb.checks.map(c => `- \`${c.code}\` — ${c.detail}`).join('\n'));
                }
              } catch (e) {
                problems.push('Could not read `heartbeat.json`: ' + e.message);
              }
            }

            const facts = hb ? [
              '', '<details><summary>Last reported state</summary>', '',
              '```json', JSON.stringify(hb, null, 1), '```', '</details>'
            ].join('\n') : '';

            const existing = (await github.rest.issues.listForRepo(
              { owner, repo, state: 'open', labels: LABEL })).data[0];

            if (problems.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Recovered. Heartbeat is ${ageMin} minutes old and every ` +
                        `check passes.${facts}` });
                await github.rest.issues.update(
                  { owner, repo, issue_number: existing.number, state: 'closed' });
              }
              core.info(`healthy, heartbeat ${ageMin} min old`);
              return;
            }

            const body = problems.join('\n\n') + facts;

            if (!existing) {
              await github.rest.issues.create({
                owner, repo, labels: [LABEL],
                title: 'Vilnius collector needs attention',
                body });
              core.warning('opened an issue');
              return;
            }

            // Already open. Say something again only occasionally, so a long
            // outage does not produce a wall of identical comments.
            const comments = (await github.rest.issues.listComments({
              owner, repo, issue_number: existing.number, per_page: 100 })).data;
            const last = comments.length
              ? new Date(comments[comments.length - 1].created_at)
              : new Date(existing.created_at);
            if (Date.now() - last.getTime() > QUIET_H * 3600 * 1000) {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: existing.number, body: 'Still failing.\n\n' + body });
              core.warning('commented on the open issue');
            } else {
              core.info('already reported recently, staying quiet');
            }
