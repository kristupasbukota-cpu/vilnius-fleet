# The alarm deliberately does not live on the collector box.
#
# On 18 August that machine stopped executing userspace for 48 minutes. Anything
# installed there to report the problem would have been frozen too. So the box only
# ever says "I am fine", every 15 minutes, by force-updating a single commit on the
# `status` branch. This job watches for that to stop, from infrastructure the box has
# no influence over, and opens an issue. GitHub emails issue notifications to the
# repository owner, so no address, token or password is configured anywhere.
name: heartbeat

on:
  schedule:
    # Not on the hour. GitHub's scheduler is busiest then and delays are common.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: heartbeat

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v8 is the first major that declares node24. v7 declares node20, which
      # GitHub deprecated in September 2025 and now force-runs on node24 anyway,
      # with a warning on every single run. Same API surface, one character.
      - uses: actions/github-script@v8
        with:
          script: |
            const STALE_MIN = 90;      // three missed heartbeats, plus slack
            const QUIET_H = 6;         // do not comment on an open issue more often
            const LOOKBACK_H = 24;     // how far back a healed fault still counts
            const LABEL = 'heartbeat';
            const MARK = 'last-event';
            const { owner, repo } = context.repo;
            const problems = [];
            let hb = null, events = [], ageMin = null;

            const read = async (path) => {
              const f = await github.rest.repos.getContent(
                { owner, repo, path, ref: 'status' });
              return JSON.parse(Buffer.from(f.data.content, 'base64').toString());
            };

            let branch = null;
            try {
              branch = (await github.rest.repos.getBranch(
                { owner, repo, branch: 'status' })).data;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            if (!branch) {
              problems.push('There is no `status` branch. The box has never sent a heartbeat.');
            } else {
              const when = new Date(branch.commit.commit.committer.date);
              ageMin = Math.round((Date.now() - when.getTime()) / 60000);
              if (ageMin > STALE_MIN) {
                problems.push(
                  `**No heartbeat for ${ageMin} minutes.** The last one was ` +
                  `${when.toISOString()}. The box sends one every 15 minutes, so ` +
                  `anything past ${STALE_MIN} means it is not reporting: frozen, ` +
                  `rebooting, off the network, or the push is failing.`);
              }
              try {
                hb = await read('heartbeat.json');
                if (hb.state !== 'ok') {
                  problems.push(
                    `**The box reports \`${hb.state}\`.**\n\n` +
                    hb.checks.map(c => `- \`${c.code}\` — ${c.detail}`).join('\n'));
                }
              } catch (e) {
                problems.push('Could not read `heartbeat.json`: ' + e.message);
              }
              // The fault log, so something that broke and fixed itself between two
              // of these hourly checks is still reported rather than lost.
              try { events = await read('events.json'); }
              catch (e) { if (e.status !== 404) core.warning('events.json: ' + e.message); }
            }

            const facts = hb ? [
              '', '<details><summary>Last reported state</summary>', '',
              '```json', JSON.stringify(hb, null, 1), '```', '</details>'
            ].join('\n') : '';

            const all = (await github.rest.issues.listForRepo(
              { owner, repo, state: 'all', labels: LABEL, per_page: 20 })).data;
            const existing = all.find(i => i.state === 'open');

            // Where the last report got to, kept in the issue body itself so this
            // job can stay stateless.
            let seen = 0;
            for (const i of all) {
              const m = (i.body || '').match(new RegExp('<!-- ' + MARK + ': ([^ ]+) -->'));
              if (m) { seen = Math.max(seen, Date.parse(m[1]) || 0); break; }
            }
            const cutoff = Date.now() - LOOKBACK_H * 3600 * 1000;
            const missed = events.filter(e => {
              const t = Date.parse(e.utc);
              return t > seen && t > cutoff;
            });
            const newest = events.length ? events[events.length - 1].utc : null;
            const stamp = newest ? `\n\n<!-- ${MARK}: ${newest} -->` : '';

            if (problems.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Recovered. Heartbeat is ${ageMin} minutes old and every ` +
                        `check passes.${facts}${stamp}` });
                await github.rest.issues.update(
                  { owner, repo, issue_number: existing.number, state: 'closed' });
                core.info('closed the open issue');
                return;
              }
              if (missed.length) {
                // Healthy now, but something went wrong since anyone last looked.
                // Raised so it reaches a notification, and closed straight away so
                // the issue list stays a list of things that still need attention.
                const first = missed[0], last = missed[missed.length - 1];
                const mins = Math.max(1, Math.round(
                  (Date.parse(last.utc) - Date.parse(first.utc)) / 60000));
                const body =
                  `The box had ${missed.length} unhappy observation` +
                  `${missed.length > 1 ? 's' : ''} and recovered on its own before ` +
                  `this check ran, so it is healthy now. Raising it anyway, because a ` +
                  `fault nobody can see afterwards is the same as no monitoring.\n\n` +
                  missed.map(e => `- **${e.utc}** \`${e.state}\` ` +
                    `[${e.codes.join('] [')}] — ${e.detail}` +
                    (e.action ? ` _(${e.action})_` : '')).join('\n') +
                  `\n\nSpanning about ${mins} minute${mins > 1 ? 's' : ''}. ` +
                  `Closed immediately; nothing needs doing.${facts}${stamp}`;
                const made = await github.rest.issues.create({
                  owner, repo, labels: [LABEL],
                  title: `Vilnius collector recovered on its own (${missed.length} event` +
                         `${missed.length > 1 ? 's' : ''})`,
                  body });
                await github.rest.issues.update(
                  { owner, repo, issue_number: made.data.number, state: 'closed' });
                core.warning(`reported ${missed.length} healed event(s)`);
                return;
              }
              core.info(`healthy, heartbeat ${ageMin} min old`);
              return;
            }

            const body = problems.join('\n\n') + facts + stamp;

            if (!existing) {
              await github.rest.issues.create({
                owner, repo, labels: [LABEL],
                title: 'Vilnius collector needs attention',
                body });
              core.warning('opened an issue');
              return;
            }

            // Already open. Say something again only occasionally, so a long
            // outage does not produce a wall of identical comments.
            const comments = (await github.rest.issues.listComments({
              owner, repo, issue_number: existing.number, per_page: 100 })).data;
            const last = comments.length
              ? new Date(comments[comments.length - 1].created_at)
              : new Date(existing.created_at);
            if (Date.now() - last.getTime() > QUIET_H * 3600 * 1000) {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: existing.number, body: 'Still failing.\n\n' + body });
              core.warning('commented on the open issue');
            } else {
              core.info('already reported recently, staying quiet');
            }
